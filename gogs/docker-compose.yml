services:
  gogs:
    image: gogs/gogs:${GOGS_TAG}
    container_name: gogs
    restart: always
    ports:
      - "33021:3000" # Web UI (Access at http://localhost:33021)
      - "33022:22"   # SSH port for Git operations (e.g., git clone ssh://git@host:33022/...)
    environment:
      - GOGS_SECURITY_SECRET_KEY=${GOGS_SECURITY_SECRET_KEY}
    volumes:
      - ./gogs-data:/data # Persists SQLite DB, app config, and repository data
    networks:
      - workplace-net

networks:
  workplace-net:
    external: true