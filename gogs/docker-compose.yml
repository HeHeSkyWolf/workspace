services:
  gogs:
    image: gogs/gogs:${GOGS_TAG}
    container_name: gogs
    restart: always
    expose:
      - "3000" # Web UI (Access at http://localhost:3000)
      - "22"   # SSH port for Git operations (e.g., git clone ssh://git@host:22/...)
    environment:
      - GOGS_SECURITY_SECRET_KEY=${GOGS_SECURITY_SECRET_KEY}
    volumes:
      - ./gogs-data:/data # Persists SQLite DB, app config, and repository data
    networks:
      - workspace-net

networks:
  workspace-net:
    external: true