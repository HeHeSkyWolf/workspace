services:
  app:
    image: "solidtime/solidtime:${SOLIDTIME_TAG}"
    user: "1000:1000"
    container_name: solidtime-app
    restart: always
    ports:
      - '${FORWARD_APP_PORT:-8000}:8000'
    networks:
      - internal
    volumes:
      - "app-storage:/var/www/html/storage"
      - "./logs:/var/www/html/storage/logs"
      - "./app-storage:/var/www/html/storage/app"
    environment:
      CONTAINER_MODE: http
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://localhost:8000/health-check/up" ]
    env_file:
      - laravel.env
    depends_on:
      - database

  scheduler:
    image: "solidtime/solidtime:${SOLIDTIME_TAG}"
    container_name: solidtime-scheduler
    user: "1000:1000"
    restart: always
    networks:
      - internal
    volumes:
      - "app-storage:/var/www/html/storage"
      - "./logs:/var/www/html/storage/logs"
      - "./app-storage:/var/www/html/storage/app"
    environment:
      CONTAINER_MODE: scheduler
    healthcheck:
      test: [ "CMD", "healthcheck" ]
    env_file:
      - laravel.env
    depends_on:
      - database

  queue:
    image: "solidtime/solidtime:${SOLIDTIME_TAG}"
    container_name: solidtime-queue
    user: "1000:1000"
    restart: always
    networks:
      - internal
    volumes:
      - "app-storage:/var/www/html/storage"
      - "./logs:/var/www/html/storage/logs"
      - "./app-storage:/var/www/html/storage/app"
    environment:
      CONTAINER_MODE: worker
      WORKER_COMMAND: "php /var/www/html/artisan queue:work"
    healthcheck:
      test: [ "CMD", "healthcheck" ]
    env_file:
      - laravel.env
    depends_on:
      - database

  database:
    image: "postgres:15"
    container_name: solidtime-db
    restart: always
    # ports:
    #  - '${FORWARD_DB_PORT:-5432}:5432'
    environment:
      PGPASSWORD: '${DB_PASSWORD:-secret}'
      POSTGRES_DB: '${DB_DATABASE}'
      POSTGRES_USER: '${DB_USERNAME}'
      POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
    volumes:
      - 'database-storage:/var/lib/postgresql/data'
    networks:
      - internal
    healthcheck:
      test:
        - CMD
        - pg_isready
        - '-q'
        - '-d'
        - '${DB_DATABASE}'
        - '-U'
        - '${DB_USERNAME}'
      retries: 3
      timeout: 5s

  gotenberg:
    image: "gotenberg/gotenberg:8"
    container_name: solidtime-gotenberg
    networks:
      - internal
    healthcheck:
      test: [ "CMD", "curl", "--silent", "--fail", "http://localhost:3000/health" ]

networks:
  internal: