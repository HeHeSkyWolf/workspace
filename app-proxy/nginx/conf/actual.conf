server {
    listen 80;
    server_name actual.localhost;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name actual.localhost;

    ssl_certificate /etc/nginx/ssl/actual.localhost.crt;
    ssl_certificate_key /etc/nginx/ssl/actual.localhost.key;

    client_max_body_size 128M;

    resolver 127.0.0.11 valid=30s ipv6=off;

    location / {
        set $backend http://actual:5006;
        proxy_pass $backend;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_request_buffering off; 
    
        proxy_intercept_errors on;
        error_page 502 503 504 /maintenance.html;
    }

    location = /maintenance.html {
        root /var/www/html;
        internal;  # Only accessible from inside Nginx
    }
}